<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مسبحة إلكترونية</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Tahoma', sans-serif;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .counter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .counter-circle {
      width: 150px;
      height: 150px;
      background: rgba(0, 132, 255, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
      position: relative;
      overflow: hidden;
    }

    .counter-circle:active {
      transform: scale(0.95);
    }

    .counter-circle::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      opacity: 0;
      transform: scale(0);
      animation: none;
      pointer-events: none;
    }

    .counter-circle.clicked::after {
      animation: pulse-effect 0.5s ease-out;
    }

    @keyframes pulse-effect {
      0% {
        opacity: 0.5;
        transform: scale(0);
      }
      50% {
        opacity: 0.3;
        transform: scale(1.2);
      }
      100% {
        opacity: 0;
        transform: scale(1.8);
      }
    }

    .reset-btn {
      padding: 10px 20px;
      background-color: #ff5c5c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .reset-btn:hover {
      background-color: #e04848;
    }
  </style>
</head>
<body>

  <div class="counter-container">
    <div class="counter-circle" onclick="increaseCount()">
      <span id="count">0</span>
    </div>
    <button class="reset-btn" onclick="resetCount()">إعادة</button>
  </div>

  <script>
    let count = 0;
    const maxCount = 20000;

    function increaseCount() {
      if (count < maxCount) {
        count++;
        document.getElementById("count").textContent = count;

        const circle = document.querySelector(".counter-circle");
        circle.classList.remove("clicked");
        void circle.offsetWidth; // لإعادة تشغيل الأنيميشن
        circle.classList.add("clicked");
      }
    }

    function resetCount() {
      count = 0;
      document.getElementById("count").textContent = count;
    }
  </script>

</body>
</html>
